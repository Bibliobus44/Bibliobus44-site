<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Admin - Bibliothèque</title>
  <link rel="stylesheet" href="bibliobus.css">
  <style>
    body { font-family: 'Unbounded', sans-serif; padding: 2rem; background: #f8faf6; color: #1a1f18; }
    h1 { margin-bottom: 2rem; }
    #login-box { max-width: 300px; margin-bottom: 2rem; }
    input, textarea, select { padding: 0.6rem; font-size: 1rem; border: 1px solid #cdd4c8; border-radius: 4px; width: 100%; }
    textarea { min-height: 120px; }
    button { padding: 0.8rem; font-weight: 700; background: #2d6a3f; color: white; border: none; cursor: pointer; border-radius: 4px; }
    button:hover { background: #24532f; }
    form { display: flex; flex-direction: column; gap: 1rem; max-width: 600px; }
    .hidden { display: none; }

    /* Blocs image + texte */
    .bloc-admin { border: 1px solid #cdd4c8; padding: 0.5rem; border-radius: 4px; margin-bottom: 1rem; }
    .bloc-image { display: flex; align-items: flex-start; gap: 1rem; margin-bottom: 1rem; }
    .bloc-image img { max-width: 40%; height: auto; }
    .bloc-image.droite { flex-direction: row-reverse; }
    .video-wrap iframe { width: 100%; height: 300px; margin-bottom: 1rem; }

    /* Bloc introduction */
    .article-intro { font-weight: 500; margin-bottom: 1.5rem; font-size: 1.1rem; }

    .editor-toolbar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .editor-toolbar button {
      padding: 0.45rem 0.7rem;
      background: #fff;
      color: #1a1f18;
      border: 1px solid #cdd4c8;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .editor-toolbar button:hover {
      background: #e2ede5;
    }

  </style>
</head>
<body>

<h1>🔒 Admin - Publication</h1>

<!-- LOGIN -->
<div id="login-box">
  <input type="password" id="admin-password" placeholder="Mot de passe">
  <button onclick="login()">Se connecter</button>
</div>

<!-- PANEL -->
<div id="admin-panel" class="hidden">
  <h2>Nouvel article</h2>

  <input type="text" id="article-title" placeholder="Titre" required>
  <select id="article-categorie">
    <option value="">-- Choisir une catégorie --</option>
    <option value="news">News</option>
    <option value="tanecdotes">Tan'ecdotes</option>
    <option value="archives">Archives</option>
    <option value="extras">Extras</option>
  </select>

  <div class="editor-toolbar">
    <button type="button" onclick="formatText('article-intro','strong')"><b>Gras</b></button>
    <button type="button" onclick="formatText('article-intro','em')"><i>Italique</i></button>
  </div>
  <!-- 🔹 Bloc d'introduction -->
  <textarea id="article-intro" placeholder="Texte d’introduction (avant les blocs)"></textarea>

  <!-- 🔹 Blocs image + texte -->
  <div id="article-blocs"></div>
  <button type="button" id="add-block-btn">Ajouter un bloc image + texte</button>
  <button id="add-block-2img-btn">Ajouter un bloc 2 images + texte</button>
  <button id="add-block-embed-btn">
    Ajouter un bloc intégré (YouTube / Maps)
  </button>
  <button id="add-block-video-btn">
    Ajouter un bloc vidéo
  </button>

  <button id="publish-article">Publier l'article</button>
  <button id="save-draft">💾 Enregistrer comme brouillon</button>
  <button id="preview-article">👁 Aperçu</button>
  <button id="save-edit" style="display:none;">Enregistrer les modifications</button>
  <button id="cancel-edit" style="display:none;">Annuler modification</button>

  <h2>Articles existants</h2>
  <div id="liste-articles"></div>

  <h2>Brouillons</h2>

  <div id="liste-brouillons"></div>

  <hr>

   
    
</div>

<div id="preview-modal" class="hidden">

    <div id="preview-content"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="admin.js"></script>
</body>
</html>
